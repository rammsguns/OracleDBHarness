[project]
name = "oracledbharness"
version = "0.1.0"
description = "OracleDBHarness - shared Oracle execution, policy and copilot layer"
requires-python = ">=3.11"
dependencies = [
    "harness-api",
    "harness-worker",
]

[project.optional-dependencies]
# The Oracle driver is not installed by default: the whole default test suite runs
# against the stand-in and does not need it. The qualification suite does.
oracle = ["harness-worker[oracle]"]

[tool.uv.workspace]
members = ["services/api", "services/worker"]

[tool.uv.sources]
harness-api = { workspace = true }
harness-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: pytest asserts are the point of the test suite.
# UP042: the str-and-Enum bases are deliberate. StrEnum changes what str() and
#   f-strings produce for a member, and these values cross into JSON, SQLAlchemy
#   columns and the published API, so the explicit .value access stays.
ignore = ["S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["harness_api", "harness_worker", "tests"]
