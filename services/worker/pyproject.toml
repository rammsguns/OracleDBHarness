[project]
name = "harness-worker"
version = "0.1.0"
description = "Oracle execution and session ownership for OracleDBHarness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_worker"]
