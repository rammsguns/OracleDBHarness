server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The console is a single-page application; unknown paths are its routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Copilot answers are streamed. Buffering here would hold the whole answer
        # until the request finished, which looks like a hang to the user.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # A long-running statement can hold the connection for its whole budget.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
